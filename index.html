<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banhos de Ervas — Guia Digital | Mundo Cigana Tarot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f7f4ee;
            --bg-sidebar: #efede6;
            --bg-surface: #ffffff;
            --bg-card: #f2eee3;
            --text-main: #2c2926;
            --text-muted: #757068;
            --accent-rose: #9e6363;
            --accent-rose-dark: #6e4141;
            --border-subtle: #e3decb;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            font-size: 15px;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            color: var(--text-main);
        }

        aside.sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 100;
            transition: var(--transition);
        }

        .sidebar-header {
            padding: 28px 24px;
            border-bottom: 1px solid var(--border-subtle);
            text-align: center;
        }

        .sidebar-header h2 { font-size: 1.5rem; color: var(--accent-rose-dark); }
        .sidebar-header p { font-size: 0.8rem; color: var(--text-muted); font-style: italic; font-family: 'Cormorant Garamond', serif; }

        .nav-tree { flex: 1; overflow-y: auto; padding: 20px 16px; }
        .nav-section { margin-bottom: 14px; }
        .nav-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-rose);
            padding: 8px 12px;
            font-weight: 550;
        }

        .nav-items { list-style: none; padding-left: 8px; }
        .nav-items li a {
            display: block;
            padding: 6px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            border-radius: 4px;
            transition: var(--transition);
        }

        .nav-items li a:hover, .nav-items li a.active {
            background-color: var(--border-subtle);
            color: var(--accent-rose-dark);
            font-weight: 400;
        }

        main.content-area { flex: 1; height: 100%; overflow-y: auto; padding: 50px 70px; scroll-behavior: smooth; }
        .content-container { max-width: 800px; margin: 0 auto; }

        h1.page-title {
            font-size: 2.6rem;
            color: var(--accent-rose-dark);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 14px;
        }

        p { margin-bottom: 16px; }

        .recipe-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 32px;
            margin-bottom: 24px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.01);
            transition: var(--transition);
        }

        .recipe-card h4 { font-size: 1.5rem; margin-bottom: 4px; color: var(--accent-rose-dark); }
        .recipe-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-rose);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .intention-box {
            background-color: var(--bg-card);
            border-left: 2px solid var(--accent-rose);
            padding: 16px 20px;
            margin: 16px 0;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.15rem;
            color: var(--accent-rose-dark);
        }

        .herb-tag {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--accent-rose-dark);
            font-size: 0.85rem;
            display: inline-block;
            margin: 3px;
            cursor: pointer;
            transition: var(--transition);
        }
        .herb-tag:hover {
            background-color: var(--border-subtle);
            border-color: var(--accent-rose);
        }

        .module-box {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 24px;
            border-radius: 6px;
            margin: 20px 0;
        }

        /* ESTILOS DA SANFONA (FICHAS EXPANSÍVEIS) */
        .accordion-header {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 16px 24px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            transition: var(--transition);
        }
        .accordion-header:hover {
            border-color: var(--accent-rose);
            background-color: #fdfdfb;
        }
        .accordion-header h4 {
            margin: 0;
            font-size: 1.4rem;
        }
        .accordion-body {
            display: none;
            padding: 24px;
            border: 1px solid var(--border-subtle);
            border-top: none;
            border-radius: 0 0 6px 6px;
            background-color: var(--bg-surface);
            margin-top: -12px;
            margin-bottom: 24px;
        }
        .accordion-body.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* LINKS INTELIGENTES (BANHOS E ERVAS) */
        .smart-link {
            color: var(--accent-rose);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 1px dashed var(--accent-rose);
            transition: var(--transition);
        }
        .smart-link:hover {
            color: var(--accent-rose-dark);
            border-bottom: 1px solid var(--accent-rose-dark);
        }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 200;
            background: var(--accent-rose-dark);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; height: 100vh; overflow: auto; }
            aside.sidebar { position: fixed; left: -100%; width: 280px; height: 100%; }
            aside.sidebar.open { left: 0; }
            main.content-area { padding: 80px 20px 40px; height: 100%; }
            .mobile-menu-btn { display: block; }
        }
    </style>
</head>
<body>

    <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰ Sumário</button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Banhos de Ervas</h2>
            <p>Mundo Cigana Tarot</p>
        </div>
        <nav class="nav-tree" id="navTree"></nav>
    </aside>

    <main class="content-area" id="mainScroll">
        <div class="content-container" id="contentContainer"></div>
    </main>

    <script>
        let appData = {};

        document.addEventListener("DOMContentLoaded", () => {
            fetch('data/content.json')
                .then(response => response.json())
                .then(data => {
                    appData = data;
                    buildSidebar();
                    loadView('inicio');
                })
                .catch(error => console.error('Erro ao carregar os dados do JSON:', error));
        });

        function buildSidebar() {
            const navTree = document.getElementById('navTree');
            navTree.innerHTML = `
                <div class="nav-section">
                    <div class="nav-section-title">Apresentação</div>
                    <ul class="nav-items">
                        <li><a href="#" onclick="loadView('inicio'); closeMobileMenu();" id="link-inicio" class="active">Visão Geral</a></li>
                    </ul>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Direcionamentos</div>
                    <ul class="nav-items">
                        <li><a href="#" onclick="loadCategory('Exu'); closeMobileMenu();" id="link-cat-Exu">Banhos de Exu</a></li>
                        <li><a href="#" onclick="loadCategory('Pombagira'); closeMobileMenu();" id="link-cat-Pombagira">Banhos de Pombagira</a></li>
                    </ul>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Banhos por Finalidade</div>
                    <ul class="nav-items">
                        <li><a href="#" onclick="loadCategory('Limpeza Energética'); closeMobileMenu();" id="link-cat-Limpeza-Energética">Limpeza Energética</a></li>
                        <li><a href="#" onclick="loadCategory('Amor e Magnetismo'); closeMobileMenu();" id="link-cat-Amor-e-Magnetismo">Amor e Magnetismo</a></li>
                        <li><a href="#" onclick="loadCategory('Trabalho e Caminhos'); closeMobileMenu();" id="link-cat-Trabalho-e-Caminhos">Trabalho e Caminhos</a></li>
                        <li><a href="#" onclick="loadCategory('Prosperidade'); closeMobileMenu();" id="link-cat-Prosperidade">Prosperidade</a></li>
                        <li><a href="#" onclick="loadCategory('Autoestima e Poder'); closeMobileMenu();" id="link-cat-Autoestima-e-Poder">Autoestima e Poder</a></li>
                        <li><a href="#" onclick="loadCategory('Proteção'); closeMobileMenu();" id="link-cat-Proteção">Proteção</a></li>
                    </ul>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Consulta Técnica</div>
                    <ul class="nav-items">
                        <li><a href="#" onclick="loadView('fichas'); closeMobileMenu();" id="link-fichas">Ficha das Ervas</a></li>
                        <li><a href="#" onclick="loadView('seguranca'); closeMobileMenu();" id="link-seguranca">Segurança e Uso</a></li>
                    </ul>
                </div>
            `;
        }

        function linkifySubstitutos(texto) {
            if(!texto) return "";
            let textLinked = texto;
            const fichas = appData.fichas_ervas || [];
            
            const sortedFichas = [...fichas].sort((a,b) => b.nome.length - a.nome.length);
            
            sortedFichas.forEach(f => {
                const regex = new RegExp("(" + f.nome + ")", "gi");
                textLinked = textLinked.replace(regex, `<a class="smart-link" onclick="abrirFicha('${f.nome}')">$1</a>`);
            });
            return textLinked;
        }

        function toggleAccordion(id) {
            const body = document.getElementById('ficha-body-' + id);
            const headerSign = document.getElementById('icon-' + id);
            
            if(body.classList.contains('active')) {
                body.classList.remove('active');
                headerSign.innerText = "+";
            } else {
                body.classList.add('active');
                headerSign.innerText = "—";
            }
        }

        function abrirFicha(nomeErva) {
            loadView('fichas');
            const safeId = nomeErva.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '');
            const targetBody = document.getElementById('ficha-body-' + safeId);
            const targetHeader = document.getElementById('icon-' + safeId);
            
            if(targetBody) {
                targetBody.classList.add('active');
                targetHeader.innerText = "—";
                
                setTimeout(() => {
                    targetBody.previousElementSibling.scrollIntoView({behavior: 'smooth', block: 'center'});
                }, 100);
            }
        }

        function irParaBanho(categoria, idBanho) {
            loadCategory(categoria);
            setTimeout(() => {
                const cardBanho = document.getElementById('banho-' + idBanho);
                if(cardBanho) {
                    cardBanho.scrollIntoView({behavior: 'smooth', block: 'center'});
                    cardBanho.style.border = "2px solid var(--accent-rose)";
                    setTimeout(() => cardBanho.style.border = "1px solid var(--border-subtle)", 2000);
                }
            }, 100);
        }

        function loadView(viewKey) {
            setActiveLink('link-' + viewKey);
            const container = document.getElementById('contentContainer');
            document.getElementById('mainScroll').scrollTop = 0;
            
            if (viewKey === 'inicio') {
                let mod1Text = (appData.modulos && appData.modulos.mod1) ? appData.modulos.mod1 : '';
                let mod2Text = (appData.modulos && appData.modulos.mod2) ? appData.modulos.mod2 : '';

                container.innerHTML = `
                    <h1 class="page-title">${appData.titulo || 'Banhos de Ervas'}</h1>
                    <p><em>${appData.subtitulo || ''}</em></p>
                    
                    <div style="width: 100%; height: 260px; margin: 24px 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-subtle); background: #eee;">
                        <img src="img/capa-atrium.jpg" alt="Atmosfera Mundo Cigana Tarot" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">
                    </div>

                    <h3>Como usar este guia</h3>
                    <p>${appData.como_usar || ''}</p>

                    ${mod1Text ? `
                        <div class="module-box">
                            <h3 style="margin-top:0; color: var(--accent-rose-dark);">Módulo I: A Matriz dos Banhos</h3>
                            <p style="margin-bottom:0;">${mod1Text}</p>
                        </div>
                    ` : ''}

                    ${mod2Text ? `
                        <div class="module-box">
                            <h3 style="margin-top:0; color: var(--accent-rose-dark);">Módulo II: Classificação Térmica</h3>
                            <p style="margin-bottom:0;">${mod2Text}</p>
                        </div>
                    ` : ''}
                `;
            } else if (viewKey === 'fichas') {
                const fichas = appData.fichas_ervas || [];
                let html = `
                    <h1 class="page-title">Ficha das Ervas</h1>
                    <p>Clique sobre uma erva para expandir suas propriedades, energia predominante e descobrir em quais receitas ela é utilizada.</p>
                    <div style="margin-top: 24px;">
                `;

                fichas.forEach(f => {
                    const banhosRelacionados = (appData.banhos || []).filter(b => b.ervas.includes(f.nome));
                    let banhosHtml = banhosRelacionados.map(b => `
                        <li style="margin-bottom: 6px;">
                            <a class="smart-link" onclick="irParaBanho('${b.categoria}', ${b.id})">${b.titulo}</a> 
                            <span style="font-size: 0.8rem; color: var(--text-muted);">(${b.categoria})</span>
                        </li>
                    `).join('');

                    let subtitutosComLinks = linkifySubstitutos(f.substituicao);
                    let safeId = f.nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '');

                    html += `
                        <div class="accordion-header" onclick="toggleAccordion('${safeId}')">
                            <h4>${f.nome}</h4>
                            <span class="icon-sign" id="icon-${safeId}" style="color: var(--accent-rose); font-size: 1.2rem; font-weight: bold;">+</span>
                        </div>
                        <div class="accordion-body" id="ficha-body-${safeId}">
                            <div class="recipe-meta" style="margin-top:0;">Tipo: ${f.tipo} • Classificação: ${f.classificacao}</div>
                            <p><strong>Energia Predominante:</strong> ${f.energia}</p>
                            <p><strong>Utilização Prática:</strong> ${f.utilizacao}</p>
                            <p><strong>Substituição:</strong> <span style="font-style: italic; color: var(--text-main);">${subtitutosComLinks || 'Nenhuma sugerida.'}</span></p>
                            
                            <div style="margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-subtle);">
                                <p style="font-size: 0.95rem; font-weight: 500; margin-bottom: 8px; color: var(--accent-rose-dark);">Banhos que utilizam esta erva:</p>
                                <ul style="list-style: none; margin-bottom: 0;">
                                    ${banhosHtml || '<li style="font-size: 0.9rem; color: var(--text-muted);">Nenhum banho cadastrado com esta erva.</li>'}
                                </ul>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            } else if (viewKey === 'seguranca') {
                container.innerHTML = `
                    <h1 class="page-title">Segurança e Uso Responsável</h1>
                    <p>${appData.seguranca || ''}</p>
                `;
            }
        }

        function loadCategory(categoryName) {
            const safeLinkId = 'link-cat-' + categoryName.replace(/\s+/g, '-');
            setActiveLink(safeLinkId);
            
            const container = document.getElementById('contentContainer');
            document.getElementById('mainScroll').scrollTop = 0;
            
            const listaBanhos = appData.banhos || [];
            const filteredBanhos = listaBanhos.filter(b => b.categoria === categoryName);

            let html = `<h1 class="page-title">${categoryName}</h1>`;
            
            if(filteredBanhos.length === 0) {
                html += `<p>Nenhum banho encontrado para esta categoria no momento.</p>`;
            }

            filteredBanhos.forEach(b => {
                let ervasHtml = b.ervas.map(e => `<span class="herb-tag" onclick="abrirFicha('${e}')" title="Ver ficha de ${e}">${e}</span>`).join(' ');
                
                html += `
                    <div class="recipe-card" id="banho-${b.id}">
                        <h4>${b.titulo}</h4>
                        <div class="recipe-meta">Direcionamento: ${b.direcionamento} • Categoria: ${b.categoria}</div>
                        <p><strong>Finalidade:</strong> ${b.finalidade}</p>
                        <p><strong>Ingredientes:</strong><br>${ervasHtml}</p>
                        <p><strong>Por que funciona:</strong> ${b.explicacao}</p>
                        <div class="intention-box">Intenção: "${b.intencao}"</div>
                        <p><strong>Modo de Preparo:</strong> ${b.preparo}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function setActiveLink(linkId) {
            document.querySelectorAll('.nav-items a').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(linkId);
            if(target) target.classList.add('active');
        }

        function toggleMobileMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function closeMobileMenu() {
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }
    </script>
</body>
</html>
